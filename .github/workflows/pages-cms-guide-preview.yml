name: Preview Pages CMS Guide Creation

on:
  workflow_dispatch:
    inputs:
      payload:
        description: "Pages CMS JSON payload"
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false


      - name: Validate and preview guide
        env:
          CMS_PAYLOAD: ${{ inputs.payload }}
        run: |
          node <<'NODE'
          const { execFileSync } = require("node:child_process");

          const payload = JSON.parse(process.env.CMS_PAYLOAD);
          const input = payload.inputs ?? {};

          if (
            payload.source !== "pages-cms" ||
            payload.action?.name !== "create-guide-preview"
          ) {
            throw new Error("Invalid Pages CMS action payload.");
          }

          const required = [
            "language",
            "template",
            "title",
            "description",
            "translationKey"
          ];

          for (const field of required) {
            if (
              typeof input[field] !== "string" ||
              !input[field].trim()
            ) {
              throw new Error(`Missing or invalid field: ${field}`);
            }
          }

          const args = [
            "scripts/create-guide.mjs",
            "--lang", input.language,
            "--template", input.template,
            "--title", input.title,
            "--description", input.description,
            "--translation-key", input.translationKey
          ];

          if (
            typeof input.subcategory === "string" &&
            input.subcategory.trim()
          ) {
            args.push("--subcategory", input.subcategory);
          }

          console.log("[IC] Starting guide generator.");
          console.log("[IC] Mode: DRY RUN");

          execFileSync(process.execPath, args, {
            stdio: "inherit"
          });

          console.log("[IC] Preview completed successfully.");
          console.log("[IC] No files committed.");
          NODE
