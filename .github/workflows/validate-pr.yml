
name: Validate Pull Request

on:
  pull_request:
    branches:
      - main
      - dev/i18n

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Astro Build & Content Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Parse Windows PowerShell review wrappers
        shell: pwsh
        run: |
          foreach ($path in @('scripts/Start-EquipmentReview.ps1', 'scripts/Finalize-EquipmentReview.ps1', 'scripts/Start-WikidotBatchReview.ps1', 'scripts/Finalize-WikidotBatchReview.ps1', 'scripts/Start-WikidotCategoryReview.ps1', 'scripts/Start-ClientEquipmentImport.ps1')) {
            $tokens = $null
            $issues = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$issues)
            if ($issues.Count -gt 0) {
              $issues | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
            Write-Host "[IC] PowerShell parser OK: $path"
          }

      - name: Validate curated-only public equipment metadata
        run: |
          node scripts/check-curated-equipment.mjs
          node --test tests/curated-equipment-gate.test.mjs tests/offline-review-workbench.test.mjs

      - name: Validate source-backed item articles
        run: |
          node scripts/check-reviewed-item-profiles.mjs
          node --test tests/reviewed-item-profiles.test.mjs tests/equipment-enchant-projection.test.mjs tests/wikidot-url-pattern.test.mjs

      - name: Validate Legendary historical source examples and opt-in L scaling
        run: |
          node scripts/check-legendary-research.mjs
          node --test tests/legendary-enhancement.test.mjs

      - name: Verify expanded in-game equipment detail evidence and all-item review coverage
        run: |
          node --test tests/extended-equipment-facts.test.mjs tests/item-article-review-queue.test.mjs
          node scripts/build-item-article-review-queue.mjs

      - name: Validate historical Wikidot audit and manual approval compiler
        run: |
          node --test tests/historical-item-profile-drafts.test.mjs
          node scripts/build-item-article-review-queue.mjs

      - name: Validate Fandom Legendary reference and client-extracted source contracts
        run: |
          node scripts/check-client-equipment-facts.mjs
          node --test tests/client-first-equipment.test.mjs tests/legendary-client-reconciliation.test.mjs tests/client-source-attributes.test.mjs tests/client-item-stat-summary.test.mjs tests/client-crafting-requirements.test.mjs tests/client-grade-export.test.mjs tests/equipment-catalog-source-index.test.mjs tests/full-client-item-database.test.mjs tests/full-client-stats-tools.test.mjs tests/client-craft-graph.test.mjs tests/full-client-equipment-source.test.mjs tests/client-craft-batch.test.mjs tests/client-monster-views.test.mjs tests/monster-item-discovery.test.mjs tests/monster-source-bands.test.mjs tests/client-drop-rate-hypothesis.test.mjs tests/community-readable-item-records.test.mjs tests/community-readable-monster-profiles.test.mjs tests/wiki-navigation.test.mjs tests/monster-level-band-resolution.test.mjs
          node scripts/check-client-item-attributes.mjs

      - name: Validate multilingual wiki appearance themes
        run: node --test tests/wiki-themes.test.mjs

      - name: Validate unified Wiki search
        run: node --test tests/wiki-unified-search.test.mjs tests/wiki-name-aliases.test.mjs tests/wiki-name-glossary.test.mjs

      - name: Validate player profile navigation
        run: node --test tests/wiki-profile-navigation.test.mjs

      - name: Validate cross-source data audit
        run: node --test tests/wiki-source-audit.test.mjs

      - name: Validate recursive crafting calculator
        run: node --test tests/client-crafting-planner.test.mjs

      - name: Validate nation dungeon calendar rules
        run: node --test tests/nation-dungeon-calendar.test.mjs

      - name: Validate equipment craft gameplay rules and recipe tree
        run: node --test tests/client-crafting-gameplay-tree.test.mjs

      - name: Validate exact craft quantity and source recipe autocomplete
        run: node --test tests/client-crafting-quantity.test.mjs

      - name: Validate intermediate batches and crafting tree breakdown
        run: node --test tests/client-crafting-tree-operations.test.mjs

      - name: Validate Excel workbook export and per-parent recipe consumption
        run: node --test tests/client-crafting-xlsx-and-ui.test.mjs

      - name: Validate snapping and responsive frozen crafting columns
        run: node --test tests/client-crafting-column-snap.test.mjs

      - name: Validate parent-operation consumption and dungeon grid readability
        run: node --test tests/crafting-operation-consumption-calendar-readability.test.mjs

      - name: Validate completed subtrees and ingredient-limited crafting operations
        run: node --test tests/client-crafting-completion-ingredient-cap.test.mjs

      - name: Validate fixed Market price research provenance and client name matches
        run: node --test tests/market-fixed-price-research.test.mjs

      - name: Validate actual client NPC price snapshot, historical crosscheck and opt-in UI
        run: node --test tests/client-npc-trade-prices-stage-20-65.test.mjs

      - name: Validate Market price candidates and browser-local evidence workbench
        run: |
          node scripts/build-market-price-review-queue.mjs --check
          node --test tests/market-price-review-stage-20-66.test.mjs

      - name: Validate player-reported Market attestation, distinct from independent verification
        run: node --test tests/market-price-player-attestation-stage-20-67.test.mjs

      - name: Validate player-first Market price catalog and source provenance
        run: |
          node scripts/build-market-price-catalog.mjs --check
          node --test tests/market-price-catalog-stage-20-68.test.mjs

      - name: Validate guide subcategories and Pages CMS
        run: node --test tests/game-systems-others-subcategory.test.mjs tests/mercenaries-introduction-subcategory.test.mjs

      - name: Validate published VIP System metadata and 16 archived images
        run: node --test tests/vip-system-guide-publication.test.mjs

      - name: Validate approved-only Pages CMS guide publication submission
        run: node --test tests/guide-publication-cms.test.mjs

      - name: Validate shared-image VIP System pt-BR translation
        run: node --test tests/vip-system-pt-br-translation.test.mjs

      - name: Validate accessible global article image lightbox
        run: node --test tests/wiki-article-image-lightbox.test.mjs

      - name: Validate eight guide locales and language routing
        run: node --test tests/wiki-eight-locales.test.mjs tests/wiki-shared-localization.test.mjs tests/wiki-localized-catalogs.test.mjs tests/wiki-item-database-locales.test.mjs tests/wiki-monster-locales.test.mjs tests/wiki-equipment-profile-locales.test.mjs tests/wiki-complementary-locales.test.mjs tests/wiki-calendar-tools-locales.test.mjs tests/wiki-crafting-locales.test.mjs tests/wiki-market-audit-locales.test.mjs

      - name: Validate guide translation pipeline without external API
        run: node --test tests/guide-translation-pipeline.test.mjs tests/guide-editorial-status.test.mjs

      - name: Validate skill book review candidates
        run: node --test tests/client-skill-books.test.mjs

      - name: Validate mercenary reference catalog
        run: node --test tests/mercenary-reference.test.mjs tests/awakening-planner.test.mjs tests/skill-progression.test.mjs tests/skill-context.test.mjs tests/main-talent-planner.test.mjs

      - name: Smoke test offline translation request export
        run: |
          node scripts/guide-translations.mjs export "$RUNNER_TEMP/translation-requests-smoke"
          test -s "$RUNNER_TEMP/translation-requests-smoke/summary.md"
          node --input-type=module -e 'import {readFileSync} from "node:fs"; const status=JSON.parse(readFileSync(process.argv[1],"utf8")); if(!Array.isArray(status.entries)||status.entries.length===0)throw Error("Missing translation status entries"); console.log("[IC] Translation status entries:",status.entries.length);' "$RUNNER_TEMP/translation-requests-smoke/status.json"

      - name: Validate Astro build
        run: npm run build

      - name: Check managed translation publication gates
        run: node scripts/check-built-translations.mjs

      - name: Check generated localized pages and hreflang
        run: node scripts/check-built-guide-locales.mjs

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate Miner read-only tooling
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v
          python scripts/validate-full-client-stats.py --candidate public/data/client-items/stats --allow-absent
          python scripts/verify-full-client-reviewed-stats.py --candidate public/data/client-items/stats --allow-absent
          python scripts/verify-full-client-source-hashes.py --candidate public/data/client-items/stats --allow-absent
          python scripts/validate-client-monster-loot.py --candidate public/data/client-monsters --allow-absent
          python scripts/verify-client-monster-source-hashes.py --candidate public/data/client-monsters --allow-absent

      - name: Validation completed
        if: success()
        run: |
          echo "[IC] Pull Request validation successful."
          echo "[IC] Astro build completed."
          echo "[IC] Content schemas validated."
