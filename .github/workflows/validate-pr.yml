
name: Validate Pull Request

on:
  pull_request:
    branches:
      - main
      - dev/i18n

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Astro Build & Content Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Astro build
        run: npm run build

      - name: Validation completed
        if: success()
        run: |
          echo "[IC] Pull Request validation successful."
          echo "[IC] Astro build completed."
          echo "[IC] Content schemas validated."
