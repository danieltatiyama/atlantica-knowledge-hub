# Atlantica Knowledge Hub - Pages CMS


actions:
  - name: create-guide-preview
    label: "Create guide from template (TEST)"
    workflow: pages-cms-guide-preview.yml
    ref: current
    confirm:
      title: "Validate new guide?"
      message: "This test validates the inputs without creating any files."
      button: "Validate"
    fields:
      - name: language
        label: Language
        type: select
        required: true
        default: en
        options:
          - label: English
            value: en
          - label: Português
            value: pt-br

      - name: template
        label: Guide template
        type: select
        required: true
        default: nation-dungeon
        options:
          - label: Nation Dungeon
            value: nation-dungeon
          - label: Mercenary
            value: mercenaries
          - label: Game System
            value: game-systems

      - name: subcategory
        label: Subcategory (optional)
        type: select
        required: false
        options:
          - label: "Nation Dungeons - Avalon"
            value: avalon
          - label: "Nation Dungeons - Babel"
            value: babel
          - label: "Nation Dungeons - Yggdrasil"
            value: yggdrasil
          - label: "Nation Dungeons - Alcatraz"
            value: alcatraz
          - label: "Nation Dungeons - Pirate"
            value: pirate
          - label: "Mercenaries - Skills"
            value: skills
          - label: "Mercenaries - Builds & Formations"
            value: builds-formations
          - label: "Game Systems - Crafting"
            value: crafting
          - label: "Game Systems - Equipment & Enhancement"
            value: equipment-enhancement

      - name: title
        label: Article title
        type: text
        required: true

      - name: description
        label: Short description
        type: text
        required: true

      - name: translationKey
        label: Article identifier
        type: text
        required: true

  - name: create-guide-draft
    label: "Create draft guide (DEV)"
    workflow: pages-cms-guide-create.yml
    ref: current
    confirm:
      title: "Create a new draft?"
      message: "This will create and commit a draft article to dev/i18n. Existing articles will never be overwritten."
      button: "Create draft"
    fields:
      - name: language
        label: Language
        type: select
        required: true
        default: en
        options:
          - label: English
            value: en
          - label: Português
            value: pt-br

      - name: template
        label: Guide template
        type: select
        required: true
        default: nation-dungeon
        options:
          - label: Nation Dungeon
            value: nation-dungeon
          - label: Mercenary
            value: mercenaries
          - label: Game System
            value: game-systems

      - name: subcategory
        label: Subcategory (optional)
        type: select
        required: false
        options:
          - label: "Nation Dungeons - Avalon"
            value: avalon
          - label: "Nation Dungeons - Babel"
            value: babel
          - label: "Nation Dungeons - Yggdrasil"
            value: yggdrasil
          - label: "Nation Dungeons - Alcatraz"
            value: alcatraz
          - label: "Nation Dungeons - Pirate"
            value: pirate
          - label: "Mercenaries - Skills"
            value: skills
          - label: "Mercenaries - Builds & Formations"
            value: builds-formations
          - label: "Game Systems - Crafting"
            value: crafting
          - label: "Game Systems - Equipment & Enhancement"
            value: equipment-enhancement

      - name: title
        label: Article title
        type: text
        required: true

      - name: description
        label: Short description
        type: text
        required: true

      - name: translationKey
        label: Article identifier
        type: text
        required: true

media:
  input: public/images
  output: /images
  rename: safe
  extensions:
    - png
    - jpg
    - jpeg
    - webp
    - gif

content:
  - name: guides-en
    label: Guides (English)
    type: collection
    path: src/content/guides/en
    format: yaml-frontmatter

    filename: "{translationKey}.md"

    operations:
      rename: false

    view:
      primary: title
      fields:
        - title
        - category
        - subcategory
        - updatedAt
        - draft
      sort:
        - updatedAt
        - title
      default:
        sort: updatedAt
        order: desc


    fields:
      - name: title
        label: Article Title
        type: string
        required: true
        description: "Clear and descriptive article title."

      - name: description
        label: Description
        type: text
        required: true
        description: "Short summary displayed in guide listings and search results."

      - name: translationKey
        label: Translation Key
        type: string
        required: true
        pattern: "^[a-z0-9-]+$"
        description: "Unique article ID shared by translations."

      - name: lang
        label: Language
        type: select
        required: true
        default: en
        options:
          values:
            - en

      - name: category
        label: Category
        type: select
        required: true
        options:
          values:
            - name: nation-dungeons
              label: Nation Dungeons
            - name: mercenaries
              label: Mercenaries
            - name: game-systems
              label: Game Systems
        description: "Main category used to organize and filter articles."

      - name: subcategory
        label: Subcategory
        type: select
        required: false
        description: "Optional. Choose a subcategory matching the main category."
        options:
          placeholder: "No subcategory"
          values:
            - name: avalon
              label: "Nation Dungeons - Avalon"
            - name: babel
              label: "Nation Dungeons - Babel"
            - name: yggdrasil
              label: "Nation Dungeons - Yggdrasil"
            - name: alcatraz
              label: "Nation Dungeons - Alcatraz"
            - name: pirate
              label: "Nation Dungeons - Pirate"
            - name: skills
              label: "Mercenaries - Skills"
            - name: builds-formations
              label: "Mercenaries - Builds & Formations"
            - name: crafting
              label: "Game Systems - Crafting"
            - name: equipment-enhancement
              label: "Game Systems - Equipment & Enhancement"

      - name: updatedAt
        label: Last Updated
        type: date
        required: true
        options:
          format: yyyy-MM-dd
        description: "Date when the article content was last reviewed or updated."

      - name: draft
        label: Draft
        type: boolean
        default: true
        description: "Only disable Draft when Editorial Status is Approved. Otherwise, the site build will fail."

      - name: reviewStatus
        label: Editorial Status
        type: select
        required: false
        default: draft
        description: "Editorial review stage. Approval does not publish the article automatically."
        options:
          values:
            - name: draft
              label: Draft
            - name: in-review
              label: In Review
            - name: approved
              label: Approved

      - name: body
        label: Article Content
        type: rich-text
        default: |
          ## Overview

          Briefly introduce the subject of this guide.

          ## Requirements

          List any prerequisites or conditions.

          ## How It Works

          Explain the relevant mechanics or procedures.

          ## Tips and Recommendations

          Add useful advice for players.

          ## Sources and Verification

          Document the sources used to verify this information.
        options:
          format: markdown
          switcher: true
          path: public/images/guides
          extensions:
            - png
            - jpg
            - jpeg
            - webp
            - gif

  - name: guides-pt-br
    label: Guias (Português)
    type: collection
    path: src/content/guides/pt-br
    format: yaml-frontmatter

    filename: "{translationKey}.md"

    operations:
      rename: false

    view:
      primary: title
      fields:
        - title
        - category
        - subcategory
        - updatedAt
        - draft
      sort:
        - updatedAt
        - title
      default:
        sort: updatedAt
        order: desc


    fields:
      - name: title
        label: Título do Artigo
        type: string
        required: true
        description: "Título claro e descritivo do artigo."

      - name: description
        label: Descrição
        type: text
        required: true
        description: "Resumo exibido nas listagens e nos resultados de pesquisa."

      - name: translationKey
        label: Chave de Tradução
        type: string
        required: true
        pattern: "^[a-z0-9-]+$"
        description: "Identificador compartilhado entre as traduções do artigo."

      - name: lang
        label: Idioma
        type: select
        required: true
        default: pt-br
        options:
          values:
            - pt-br

      - name: category
        label: Categoria
        type: select
        required: true
        options:
          values:
            - name: nation-dungeons
              label: Dungeons da Nação
            - name: mercenaries
              label: Mercenários
            - name: game-systems
              label: Sistemas do Jogo
        description: "Categoria principal usada para organizar e filtrar os artigos."

      - name: subcategory
        label: Subcategoria
        type: select
        required: false
        description: "Opcional. Selecione uma subcategoria da categoria principal."
        options:
          placeholder: "Sem subcategoria"
          values:
            - name: avalon
              label: "Dungeons da Nação - Avalon"
            - name: babel
              label: "Dungeons da Nação - Babel"
            - name: yggdrasil
              label: "Dungeons da Nação - Yggdrasil"
            - name: alcatraz
              label: "Dungeons da Nação - Alcatraz"
            - name: pirate
              label: "Dungeons da Nação - Pirate"
            - name: skills
              label: "Mercenários - Habilidades"
            - name: builds-formations
              label: "Mercenários - Builds e Formações"
            - name: crafting
              label: "Sistemas do Jogo - Fabricação"
            - name: equipment-enhancement
              label: "Sistemas do Jogo - Equipamentos e Aprimoramento"

      - name: updatedAt
        label: Última Atualização
        type: date
        required: true
        options:
          format: yyyy-MM-dd
        description: "Data da última revisão ou atualização do conteúdo do artigo."

      - name: draft
        label: Rascunho
        type: boolean
        default: true
        description: "Desative Rascunho apenas quando o Status Editorial estiver como Aprovado. Caso contrário, o build falhará."

      - name: reviewStatus
        label: Status Editorial
        type: select
        required: false
        default: draft
        description: "Etapa de revisão editorial. A aprovação não publica automaticamente o artigo."
        options:
          values:
            - name: draft
              label: Em elaboração
            - name: in-review
              label: Em revisão
            - name: approved
              label: Aprovado

      - name: body
        label: Conteúdo do Artigo
        type: rich-text
        default: |
          ## Visão Geral

          Introduza brevemente o assunto deste guia.

          ## Requisitos

          Liste quaisquer pré-requisitos ou condições.

          ## Como Funciona

          Explique os mecanismos ou procedimentos relevantes.

          ## Dicas e Recomendações

          Adicione conselhos úteis para os jogadores.

          ## Fontes e Verificação

          Documente as fontes utilizadas para verificar esta informação.
        options:
          format: markdown
          switcher: true
          path: public/images/guides
          extensions:
            - png
            - jpg
            - jpeg
            - webp
            - gif

# Events & Mercenaries: reviewed editorial content only.

  - name: events-en
    label: "Events (English) — verified editorial only"
    type: collection
    path: src/content/events/en
    format: yaml-frontmatter
    filename: "{translationKey}.md"
    operations:
      rename: false
    view:
      primary: title
      fields:
        - title
        - updatedAt
        - draft
        - reviewStatus
      sort:
        - updatedAt
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: description
        label: Description
        type: text
        required: true
      - name: translationKey
        label: Shared translation key
        type: string
        required: true
        pattern: "^[a-z0-9-]+$"
      - name: lang
        label: Language
        type: select
        required: true
        default: en
        options:
          values:
            - en
      - name: kind
        label: Type
        type: select
        required: true
        options:
          values:
            - event
            - pass
            - challenge
            - promotion
            - update
      - name: startsAt
        label: Verified start time (timezone-aware ISO-8601, optional)
        type: string
        required: false
      - name: endsAt
        label: Verified end time (timezone-aware ISO-8601, optional)
        type: string
        required: false
      - name: updatedAt
        label: Review date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: draft
        label: Draft
        type: boolean
        default: true
        description: "Do not commit unreviewed private client data, even as a draft."
      - name: reviewStatus
        label: Editorial review status
        type: select
        default: draft
        options:
          values:
            - draft
            - in-review
            - approved
      - name: evidenceStatus
        label: Independently verified evidence
        type: select
        default: client-config
        description: "Client-only data CANNOT be published."
        options:
          values:
            - client-config
            - in-game-verified
            - official-announced
      - name: verificationUrl
        label: Official verification URL (required if official-announced)
        type: string
        required: false
      - name: verificationNote
        label: In-game verification note (required if in-game-verified)
        type: text
        required: false
      - name: body
        label: Reviewed content
        type: rich-text
        default: |
          ## Overview

          Source-checked summary. Do not copy unreleased client data.
        options:
          format: markdown
          switcher: true
          path: public/images/guides
          extensions:
            - png
            - jpg
            - jpeg
            - webp
            - gif

