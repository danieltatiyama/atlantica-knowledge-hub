# Atlantica Knowledge Hub - Pages CMS

media:
  input: public/images
  output: /images
  rename: safe
  extensions:
    - png
    - jpg
    - jpeg
    - webp
    - gif

content:
  - name: guides-en
    label: Guides (English)
    type: collection
    path: src/content/guides/en
    format: yaml-frontmatter

    filename: "{translationKey}.md"

    operations:
      rename: false

    view:
      primary: title
      fields:
        - title
        - category
        - updatedAt
        - draft
      sort:
        - updatedAt
        - title
      default:
        sort: updatedAt
        order: desc

    fields:
      - name: title
        label: Article Title
        type: string
        required: true

      - name: description
        label: Description
        type: text
        required: true

      - name: translationKey
        label: Translation Key
        type: string
        required: true
        pattern: "^[a-z0-9-]+$"
        description: "Unique article ID shared by translations."

      - name: lang
        label: Language
        type: select
        required: true
        default: en
        options:
          values:
            - en

      - name: category
        label: Category
        type: select
        required: true
        options:
          values:
            - name: nation-dungeons
              label: Nation Dungeons
            - name: mercenaries
              label: Mercenaries
            - name: game-systems
              label: Game Systems

      - name: subcategory
        label: Subcategory
        type: select
        required: false
        description: "Optional. Choose a subcategory matching the main category."
        options:
          placeholder: "No subcategory"
          values:
            - name: avalon
              label: "Nation Dungeons - Avalon"
            - name: babel
              label: "Nation Dungeons - Babel"
            - name: yggdrasil
              label: "Nation Dungeons - Yggdrasil"
            - name: alcatraz
              label: "Nation Dungeons - Alcatraz"
            - name: pirate
              label: "Nation Dungeons - Pirate"
            - name: skills
              label: "Mercenaries - Skills"
            - name: builds-formations
              label: "Mercenaries - Builds & Formations"
            - name: crafting
              label: "Game Systems - Crafting"
            - name: equipment-enhancement
              label: "Game Systems - Equipment & Enhancement"

      - name: updatedAt
        label: Last Updated
        type: date
        required: true
        options:
          format: yyyy-MM-dd

      - name: draft
        label: Draft
        type: boolean
        default: true

      - name: body
        label: Article Content
        type: rich-text
        options:
          format: markdown
          switcher: true
          path: public/images/guides
          extensions:
            - png
            - jpg
            - jpeg
            - webp
            - gif

  - name: guides-pt-br
    label: Guias (Português)
    type: collection
    path: src/content/guides/pt-br
    format: yaml-frontmatter

    filename: "{translationKey}.md"

    operations:
      rename: false

    view:
      primary: title
      fields:
        - title
        - category
        - updatedAt
        - draft
      sort:
        - updatedAt
        - title
      default:
        sort: updatedAt
        order: desc

    fields:
      - name: title
        label: Título do Artigo
        type: string
        required: true

      - name: description
        label: Descrição
        type: text
        required: true

      - name: translationKey
        label: Chave de Tradução
        type: string
        required: true
        pattern: "^[a-z0-9-]+$"
        description: "Identificador compartilhado entre as traduções do artigo."

      - name: lang
        label: Idioma
        type: select
        required: true
        default: pt-br
        options:
          values:
            - pt-br

      - name: category
        label: Categoria
        type: select
        required: true
        options:
          values:
            - name: nation-dungeons
              label: Dungeons da Nação
            - name: mercenaries
              label: Mercenários
            - name: game-systems
              label: Sistemas do Jogo

      - name: subcategory
        label: Subcategoria
        type: select
        required: false
        description: "Opcional. Selecione uma subcategoria da categoria principal."
        options:
          placeholder: "Sem subcategoria"
          values:
            - name: avalon
              label: "Dungeons da Nação - Avalon"
            - name: babel
              label: "Dungeons da Nação - Babel"
            - name: yggdrasil
              label: "Dungeons da Nação - Yggdrasil"
            - name: alcatraz
              label: "Dungeons da Nação - Alcatraz"
            - name: pirate
              label: "Dungeons da Nação - Pirate"
            - name: skills
              label: "Mercenários - Habilidades"
            - name: builds-formations
              label: "Mercenários - Builds e Formações"
            - name: crafting
              label: "Sistemas do Jogo - Fabricação"
            - name: equipment-enhancement
              label: "Sistemas do Jogo - Equipamentos e Aprimoramento"

      - name: updatedAt
        label: Última Atualização
        type: date
        required: true
        options:
          format: yyyy-MM-dd

      - name: draft
        label: Rascunho
        type: boolean
        default: true

      - name: body
        label: Conteúdo do Artigo
        type: rich-text
        options:
          format: markdown
          switcher: true
          path: public/images/guides
          extensions:
            - png
            - jpg
            - jpeg
            - webp
            - gif
